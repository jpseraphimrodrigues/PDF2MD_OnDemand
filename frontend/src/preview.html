<!doctype html>
<meta charset="utf-8">
<style>
  html { background: #f4f7fb; }
  body { font: 15px/1.65 "Segoe UI", "Noto Sans", sans-serif; margin: 0; color: #263445; background: #f4f7fb; }
  #preview { box-sizing: border-box; max-width: 980px; min-height: 100vh; margin: 0 auto; padding: 34px 42px; background: #fff; }
  h1, h2, h3, h4 { color: #1f2e40; line-height: 1.3; }
  h1, h2 { padding-bottom: .35em; border-bottom: 1px solid #e5ebf2; }
  p, li { overflow-wrap: anywhere; }
  a { color: #276bb3; }
  pre, :not(pre) > code { background: #f3f6fa; border-radius: 4px; }
  pre { overflow-x: auto; padding: 14px 16px; border: 1px solid #e3e9f0; }
  :not(pre) > code { padding: .12em .32em; }
  blockquote { margin: 1em 0; padding: .15em 1em; border-left: 3px solid #cbd6e3; color: #52647a; }
  table { border-collapse: collapse; max-width: 100%; }
  th, td { border: 1px solid #dce4ee; padding: 6px 10px; }
  th { background: #f3f6fa; text-align: left; }
  a.internal-link, a.wikilink { color: #1d4ed8; text-decoration: underline; text-decoration-style: dotted; }
  a.internal-link:hover, a.wikilink:hover { color: #1e40af; text-decoration-style: solid; }
  .mermaid-diagram { max-width: 100%; overflow-x: auto; text-align: center; padding: 12px 0; }
  .mermaid-diagram svg { max-width: 100%; height: auto; }
  blockquote.callout { border-left: 4px solid #64748b; background: #f8fafc; padding: .1rem 1rem; margin-inline: 0; }
  .callout-title { color: #334155; font-weight: 700; margin: .5rem 0; }
  .callout-tip, .callout-success { border-color: #16a34a !important; background: #f0fdf4 !important; }
  .callout-warning, .callout-caution, .callout-danger, .callout-failure { border-color: #ea580c !important; background: #fff7ed !important; }
  .callout-important, .callout-question { border-color: #7c3aed !important; background: #f5f3ff !important; }
</style>
<article id="preview"></article>
