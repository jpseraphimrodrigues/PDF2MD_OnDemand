[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "pdf2md_build"
backend-path = ["."]

[project]
name = "pdf2md-ondemand"
version = "0.1.0"
description = "Local-first Markdown workspace"
requires-python = ">=3.13,<3.14"
dependencies = ["PySide6"]

[project.scripts]
pdf2md = "pdf2md_ondemand.__main__:main"

[dependency-groups]
dev = ["mypy", "pytest", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.cmdclass]
build_py = "pdf2md_build.BuildPy"

[tool.setuptools.package-data]
pdf2md_ondemand = ["ui/desktop/frontend/*.html", "ui/desktop/frontend/*.js"]


[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source_pkgs = ["pdf2md_ondemand"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
